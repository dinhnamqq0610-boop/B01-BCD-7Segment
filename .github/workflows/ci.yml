
name: BCD 7-Segment CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  simulation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Compile testbench
        run: |
          iverilog -g2012 -o sim/bcd_test rtl/bcd_7segment.v tb/tb_bcd_7segment.v

      - name: Run simulation
        run: |
          vvp sim/bcd_test
